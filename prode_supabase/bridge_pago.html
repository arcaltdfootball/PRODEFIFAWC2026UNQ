<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Volviendo al Prode…</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0f19;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #f1f5f9;
  }
  .wrap {
    min-height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 32px 20px;
  }
  .spinner {
    width: 44px; height: 44px; margin-bottom: 22px;
    border-radius: 50%;
    border: 4px solid rgba(232,201,107,0.18);
    border-top-color: #e8c96b;
    animation: girar 0.8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  h1 {
    font-size: 1.15rem; font-weight: 700; margin: 0 0 8px 0; color: #f1f5f9;
  }
  p.sub {
    font-size: 0.92rem; color: #94a3b8; margin: 0 0 26px 0; max-width: 320px; line-height: 1.5;
  }
  #manualBox { display: none; margin-top: 4px; }
  #manualLink {
    display: inline-block;
    background-color: #e8c96b; color: #0b0f19 !important;
    text-decoration: none; font-weight: 700; font-size: 15px;
    padding: 13px 26px; border-radius: 8px;
  }
  #manualBox p {
    font-size: 0.82rem; color: #64748b; margin: 0 0 12px 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner" aria-hidden="true"></div>
    <h1 id="titulo">Confirmando tu pago…</h1>
    <p class="sub" id="subtitulo">Ya volviste de Mercado Pago. Te estamos llevando de nuevo a tu boleta, un segundo.</p>

    <div id="manualBox">
      <p>Si no te redirigió solo después de unos segundos, tocá acá:</p>
      <a id="manualLink" href="#">Entrar a mi boleta</a>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ── 1. Armar la URL de destino a partir de los parámetros que nos
  //    pasó 03_Boleta_digital.py (?destino=...) más TODO lo que
  //    Mercado Pago le haya agregado atrás (collection_id, status,
  //    payment_id, external_reference, etc.) ────────────────────────────
  var params = new URLSearchParams(window.location.search);
  var destino = params.get("destino");
  params.delete("destino");

  var titulo = document.getElementById("titulo");
  var subtitulo = document.getElementById("subtitulo");
  var manualBox = document.getElementById("manualBox");
  var manualLink = document.getElementById("manualLink");

  if (!destino) {
    // No debería pasar nunca en el flujo normal (siempre lo mandamos
    // nosotros), pero si pasa, no dejamos a nadie colgado mirando un
    // spinner que no va a ningún lado.
    titulo.textContent = "No pudimos determinar a dónde volver.";
    subtitulo.textContent = "Volvé a entrar desde el link que usás siempre para jugar al Prode.";
    return;
  }

  var qs = params.toString();
  var target = destino + (qs ? ("?" + qs) : "");
  manualLink.href = target;

  // Mostramos el botón manual como red de seguridad SIEMPRE a los 3s,
  // esté o no todavía esperando el "despertador" de abajo. Así, pase lo
  // que pase con el JS de más abajo, el usuario tiene una salida.
  setTimeout(function () {
    manualBox.style.display = "block";
  }, 3000);

  // ── 2. "Despertar" el servidor de Streamlit ANTES de navegar ────────
  // Si el hosting duerme la app por inactividad (o el WebSocket tarda
  // en levantar), pegarle un pedido de red de antemano reduce las
  // chances de que el usuario llegue a la página real y se quede
  // mirando el logo de carga de Streamlit sin que nada pase. Este ping
  // es "best effort": si falla, no rompe nada, simplemente navegamos
  // igual pasado el tiempo de espera máximo.
  var origin;
  try {
    origin = new URL(destino).origin;
  } catch (e) {
    origin = window.location.origin;
  }

  var listo = false;
  function marcarListo() { listo = true; }

  try {
    fetch(origin, { mode: "no-cors", cache: "no-store" })
      .then(marcarListo)
      .catch(marcarListo);
  } catch (e) {
    listo = true; // fetch ni siquiera existe (navegador viejísimo): no esperamos.
  }

  // ── 3. Navegar: esperamos a que el ping vuelva (éxito o error, da
  //    igual) con un piso de 700ms para que el mensaje se alcance a
  //    leer, y un techo de 2.8s para no hacer esperar de más si todo
  //    ya está despierto y responde rápido. ────────────────────────────
  var PASO = 150, MIN_ESPERA = 700, MAX_ESPERA = 2800, transcurrido = 0;
  var navegando = false;

  function irAlDestino() {
    if (navegando) return;
    navegando = true;
    window.location.replace(target);
  }

  var reloj = setInterval(function () {
    transcurrido += PASO;
    if ((listo && transcurrido >= MIN_ESPERA) || transcurrido >= MAX_ESPERA) {
      clearInterval(reloj);
      irAlDestino();
    }
  }, PASO);

  // Si el usuario vuelve a esta pestaña después de haberla mandado a
  // segundo plano (p.ej. cambió de app y volvió), reintentamos por si
  // el timer se pausó mientras estaba en background.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && !navegando) {
      irAlDestino();
    }
  });
})();
</script>
</body>
</html>
